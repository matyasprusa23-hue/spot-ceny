name: Aktualizace cen

on:
  schedule:
    # čas je v UTC: pokrývá cca 7:20 a 15:20 v letním i zimním čase
    - cron: "20 5,6,13,14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update_data.py
      - name: Uložit nová data
        run: |
          git config user.name "spot-bot"
          git config user.email "spot-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Žádná změna"
          else
            git commit -m "Data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
